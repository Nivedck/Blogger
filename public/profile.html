<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile – Bloggr</title>
<meta name="description" content="View a Bloggr user's profile and posts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav" id="main-nav" aria-label="Main navigation"></nav><div class="page-narrow">
<div id="loading" class="loading-row">
<span class="spinner"></span> Loading…</div>
<div id="error-state" class="empty-state hidden"><h2>User not found</h2></div>
<div id="profile-content" class="hidden">
<div class="profile-header">
<div class="avatar" id="avatar-letter">?</div>
<div class="profile-info">
<h1 id="profile-name"></h1>
<p class="profile-bio" id="profile-bio"></p>
<p class="text-muted text-sm mt-sm" id="profile-joined"></p>
</div>
</div>
<div id="edit-section" class="hidden card" style="padding:1.25rem;margin-bottom:1.5rem">
<h2 style="margin-bottom:1rem">Edit profile</h2>
<div class="alert alert-error hidden" id="profile-alert"></div>
<div class="alert alert-success hidden" id="profile-success"></div>
<div class="form-group">
<label for="edit-name">Name</label><input type="text" id="edit-name" maxlength="100">
</div>
<div class="form-group">
<label for="edit-bio">Bio</label><textarea id="edit-bio" rows="3" maxlength="500" placeholder="Tell us about yourself…"></textarea>
</div>
<div style="display:flex;gap:.5rem;flex-wrap:wrap">
<button class="btn btn-primary btn-sm" id="save-profile-btn">Save</button><button class="btn btn-danger btn-sm" id="delete-account-btn" style="margin-left:auto">Delete account</button>
</div>
</div>
<h2 id="posts-heading" style="margin-bottom:1rem"></h2>
<div id="posts-list"></div>
</div>
</div>
<script type="module" src="js/pages/profile.js"></script>
</body>
</html>
