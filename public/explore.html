<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explore – Bloggr</title>
<meta name="description" content="Browse and search published blog posts on Bloggr.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav" id="main-nav" aria-label="Main navigation"></nav><div class="page"><div class="explore-layout">
<main><header class="explore-heading"><span class="eyebrow">The reading room</span><h1>Stories worth sitting with.</h1>
<p>Find sharp ideas, generous perspectives, and writers with something to say.</p></header><div class="filter-bar">
<input type="search" id="search-input" placeholder="Search posts…" aria-label="Search posts"><button class="btn btn-secondary btn-sm" id="search-btn">Search</button>
</div>
<div id="tag-filter-strip" class="mb-md" style="display:flex;gap:.4rem;flex-wrap:wrap;"></div>
<div id="blog-list"><div class="loading-row">
<span class="spinner"></span> Loading…</div></div>
<div id="pagination" class="pagination"></div></main><aside class="sidebar"><div class="sidebar-block">
<p class="sidebar-title">Popular tags</p>
<div id="popular-tags" style="display:flex;flex-wrap:wrap;gap:.35rem;"><span class="text-muted text-sm">Loading…</span></div>
</div>
<div class="sidebar-block" id="write-cta" style="display:none">
<p class="sidebar-title">Your writing</p>
<a href="editor.html" class="btn btn-primary btn-sm" style="width:100%;justify-content:center">Write a post</a>
</div></aside>
</div></div>
<script type="module" src="js/pages/explore.js"></script>
</body>
</html>
