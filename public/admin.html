<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin – Bloggr</title>
<meta name="description" content="Bloggr admin moderation panel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav" id="main-nav" aria-label="Main navigation"></nav><div class="page">
<h1 class="page-title">Admin panel</h1>
<div class="admin-tabs" role="tablist">
<button class="admin-tab active" role="tab" data-tab="reports">Reports</button><button class="admin-tab" role="tab" data-tab="users">Users</button>
</div>
<div id="tab-reports">
<div style="display:flex;align-items:center;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap">
<label for="status-filter" class="text-sm">Filter by status:</label><select id="status-filter" style="width:auto"><option value="">All</option>
<option value="pending">Pending</option>
<option value="reviewed">Reviewed</option>
<option value="resolved">Resolved</option>
<option value="rejected">Rejected</option></select><button class="btn btn-secondary btn-sm" id="refresh-reports-btn">Refresh</button>
</div>
<div id="reports-list"><div class="loading-row">
<span class="spinner"></span> Loading…</div></div>
<div id="reports-pagination" class="pagination"></div>
</div>
<div id="tab-users" class="hidden">
<div id="users-list"><div class="loading-row">
<span class="spinner"></span> Loading…</div></div>
<div id="users-pagination" class="pagination"></div>
</div>
</div>
<script type="module" src="js/pages/admin.js"></script>
</body>
</html>
