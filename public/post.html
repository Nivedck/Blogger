<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post – Bloggr</title>
<meta name="description" content="Read and interact with a Bloggr post.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav" id="main-nav" aria-label="Main navigation"></nav><div class="page-narrow">
<div id="loading" class="loading-row">
<span class="spinner"></span> Loading…</div>
<div id="error-state" class="empty-state hidden">
<h2>Post not found</h2>
<p><a href="explore.html">← Back to explore</a></p>
</div>
<article id="post-content" class="hidden"><header class="post-header"><h1 class="post-title" id="post-title"></h1>
<div class="post-meta" id="post-meta"></div>
<div style="margin-top:.75rem" id="tags-row"></div></header><hr>
<div class="post-body" id="post-body"></div>
<hr>
<div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.5rem">
<div class="interaction-strip">
<button class="vote-btn" id="upvote-btn" title="Upvote">▲ <span id="upvote-count">0</span></button><button class="vote-btn" id="downvote-btn" title="Downvote">▼ <span id="downvote-count">0</span></button>
</div>
<div style="margin-left:auto;display:flex;gap:.5rem" id="author-actions"></div>
</div>
<div id="report-row" class="hidden" style="margin-bottom:1.5rem"><button class="btn btn-ghost btn-sm text-muted" id="report-btn">Report this post</button></div></article><section class="comment-thread hidden" id="comment-section"><h2 class="comment-section-title" id="comment-section-title">Comments</h2>
<div id="comment-form-wrap">
<div class="alert alert-error hidden" id="comment-alert"></div>
<form id="comment-form">
<div class="form-group">
<label for="comment-input" class="sr-only">Write a comment</label><textarea id="comment-input" placeholder="Write a comment…" rows="3" maxlength="3000"></textarea>
</div>
<div style="display:flex;justify-content:flex-end"><button type="submit" class="btn btn-primary btn-sm" id="comment-submit">Post comment</button></div>
</form>
</div>
<div id="comments-list" style="margin-top:1rem"></div></section><div id="report-modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem"><div class="auth-card" style="max-width:420px;width:100%">
<h2 style="margin-bottom:1rem">Report this post</h2>
<div class="alert alert-error hidden" id="report-alert"></div>
<div class="form-group">
<label for="report-reason">Reason</label><textarea id="report-reason" rows="3" maxlength="1000" placeholder="Describe the issue…"></textarea>
</div>
<div style="display:flex;gap:.5rem;justify-content:flex-end">
<button class="btn btn-secondary btn-sm" id="report-cancel">Cancel</button><button class="btn btn-danger btn-sm" id="report-submit">Submit report</button>
</div>
</div></div>
</div>
<script type="module" src="js/pages/post.js"></script>
</body>
</html>
